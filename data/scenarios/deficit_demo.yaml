# A minimal, valid MANDATE scenario fixture whose default budget runs a
# deficit large enough to exhaust opening cash and require new borrowing —
# the counterpart to tiny_valid.yaml's deliberately sustainable budget.
#
# Hand-checked expected outcome for turn 0 with no budget decision submitted
# (see docs/economy_methodology.md for the full worked derivation). As of Phase 2B2, tax
# bases are no longer authored (see `finance.tax_base_coefficients` below) — they are
# derived every turn from this country's economy. The economy below is deliberately
# calibrated so the derived bases reproduce personal=1,000,000,000 / corporate=500,000,000 /
# taxable_consumption=800,000,000 EXACTLY, so every figure below is unchanged from the
# original Phase 2A/2B1 fixture:
#
#   revenue:  personal=120,000,000  corporate=80,000,000  consumption=51,200,000
#             total_revenue=251,200,000
#   spending: total_program_spending=670,000,000
#   interest: quarterly_interest_expense=40,000,000  (8% annual on 2,000,000,000)
#   pre_financing_balance = 251,200,000 - 670,000,000 - 40,000,000 = -458,800,000
#   cash_before_financing = 50,000,000 + (-458,800,000) = -408,800,000
#   new_borrowing = 408,800,000   (exactly covers the shortfall after cash)
#   closing_cash  = 0             (opening cash fully consumed first)
#   closing_debt  = 2,000,000,000 + 408,800,000 = 2,408,800,000
#
# Note: ruleset_version is NOT declared here — see tiny_valid.yaml's header.

schema_version: 1
scenario_id: deficit_demo
name: "Deficit Demo Fixture"
content_version: "0.10.0"
seed: 99
player_country_id: strapped

countries:
  - id: strapped
    name: "Republic of Strapped"
    population: 400000
    treasury:
      cash_on_hand: 50000000     #     500,000.00 denars — thin reserves on purpose
      debt: 2000000000           #  20,000,000.00 denars
    population_groups:
      - id: citizens
        name: "Citizens"
        population_share: 1.0
        political_influence: 50
        approval: 45
        trust: 40
        organization: 25
        radicalization: 8
    institutions:
      - id: executive
        name: "Executive Government"
        loyalty: 60
        power: 55
        competence: 45
        corruption: 25
    finance:
      # As of Phase 2B2, tax bases are derived from the economy below, not authored here.
      tax_base_coefficients:
        personal_taxable_share_bps: 10000              # 100% of sector labor income is personal tax base
        corporate_taxable_share_bps: 5000               # 50% of sector operating surplus is corporate tax base
        effective_consumption_base_share_bps: 4000       # 40% of sector modeled value added is consumption tax base
      tax_policy:
        personal_income_rate_bps: 1500   # 15%
        corporate_rate_bps: 2000         # 20%
        consumption_rate_bps: 800        #  8%
        compliance_rate_bps: 8000        # 80%
      spending_plan:
        health: 150000000            #   1,500,000.00 denars
        education: 100000000         #   1,000,000.00 denars
        welfare: 150000000           #   1,500,000.00 denars
        infrastructure: 80000000     #     800,000.00 denars
        defense: 100000000           #   1,000,000.00 denars
        security: 50000000           #     500,000.00 denars
        administration: 40000000     #     400,000.00 denars
      annual_debt_interest_rate_bps: 800   # 8% annual
    economy:
      # Phase 2B3 calibration: capacities are unchanged from Phase 2B2 — employment is no
      # longer authored (SectorState no longer has an employed_workers field); it is fully
      # derived every turn from effective_labor_force_share_bps (below) plus each sector's
      # quarterly_capacity_output/output_per_worker. output_per_worker is retuned (never
      # capacity, population, or the labor-force share) so labor demand rises from the 11,000
      # the old authored employment totaled to a plausible ~10% unemployment level, while every
      # sector's actual_output — and therefore every derived tax base/revenue/interest/
      # borrowing/reconciliation figure below — stays byte-for-byte identical to Phase 2B2:
      #   5 sectors:  required=10,000  10,000 *  50,000 =  500,000,000 = capacity  500,000,000 -> exactly_balanced, actual=500,000,000
      #   5 sectors:  required=25,000  25,000 *  10,000 =  250,000,000 = capacity  250,000,000 -> exactly_balanced, actual=250,000,000
      #   public_services: required=5,000  5,000 * 50,000 =  250,000,000 = capacity  250,000,000 -> exactly_balanced, actual=250,000,000
      # total_labor_demand = 5*10,000 + 5*25,000 + 5,000 = 180,000
      # effective_labor_force = floor(400,000 * 5000 / 10,000) = 200,000
      # total_employment = 180,000; unemployed = 20,000; unemployment_rate = exactly 10.00% (1000 bps)
      # total_gross_output = 5*500,000,000 + 5*250,000,000 + 250,000,000 = 4,000,000,000
      #   (byte-identical to Phase 2B2's figure, since every actual_output above is unchanged)
      # Every sector uses value_added_share_bps=5000 (50%) / labor_income_share_bps=5000 (50%).
      # Derivation check (unchanged from Phase 2B2 — coefficients personal=10000, corporate=5000,
      # consumption=4000):
      #   modeled_value_added = 4,000,000,000 * 0.5 = 2,000,000,000
      #   labor_income        = 2,000,000,000 * 0.5 = 1,000,000,000
      #   operating_surplus   = 2,000,000,000 - 1,000,000,000 = 1,000,000,000
      #   personal_income base    = 1,000,000,000 * 1.0 = 1,000,000,000  (matches original exactly)
      #   corporate_profit base   = 1,000,000,000 * 0.5 =   500,000,000  (matches original exactly)
      #   taxable_consumption base= 2,000,000,000 * 0.4 =   800,000,000  (matches original exactly)
      effective_labor_force_share_bps: 5000   # 50% of population is economically active (reduced form)
      sectors:
        - category: agriculture
          quarterly_capacity_output: 500000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: extraction
          quarterly_capacity_output: 500000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: manufacturing
          quarterly_capacity_output: 500000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: construction
          quarterly_capacity_output: 500000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: energy
          quarterly_capacity_output: 500000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: transportation
          quarterly_capacity_output: 250000000
          output_per_worker: 10000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: consumer_services
          quarterly_capacity_output: 250000000
          output_per_worker: 10000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: finance_and_professional_services
          quarterly_capacity_output: 250000000
          output_per_worker: 10000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: technology
          quarterly_capacity_output: 250000000
          output_per_worker: 10000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: defense_industry
          quarterly_capacity_output: 250000000
          output_per_worker: 10000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: public_services
          quarterly_capacity_output: 250000000
          output_per_worker: 50000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000

      # Phase 2C1: resource-poor / import-dependent. The extraction sector's allocated_workers
      # this turn is 10,000 (see the required=10,000 row above; abundant labor means allocated ==
      # required). Only timber and iron_ore have any endowment; the other six categories are
      # legitimate zero-stock/zero-capacity entries (a resource-poor country still declares every
      # category, just at zero — output_per_worker=1 is the minimum valid StrictResourceQuantity
      # PerWorker value, never exercised since capacity is 0). total_required = 400 (timber) + 400
      # (iron_ore) = 800 <= 10,000, so both get exactly their requirement and
      # unassigned_resource_workers = 10,000 - 800 = 9,200. Imports are NOT implemented in Phase
      # 2C1 — this scenario's resource poverty has no in-game consequence yet.
      #
      # Timber (the only renewable) turn-0 check: regenerated = min(5,000, 250,000 - 200,000) =
      # 5,000; available = 205,000; extracted = min(205,000, 10,000, 400*25=10,000) = 10,000;
      # closing = 195,000. Conservation: 200,000 + 5,000 = 10,000 + 195,000 = 205,000.
      #
      # Multi-turn trajectory (counted by completed resolutions; see docs/economy_methodology.md
      # and ADR 0007 for the full derivation) — THREE distinct regimes, not two:
      #   resolutions 1-39:  CAPACITY_CONSTRAINED, declining 5,000/resolution net of regeneration,
      #                      closing stock reaching exactly 5,000 at resolution 39.
      #   resolution 40:     the boundary turn — opening 5,000 + regen 5,000 = available 10,000,
      #                      which TIES capacity (10,000); extracted=10,000, closing=0. Because the
      #                      status precedence checks extracted==available before
      #                      extracted==capacity, this resolves to STOCK_CONSTRAINED, not
      #                      CAPACITY_CONSTRAINED, even though extraction is still the full 10,000.
      #   resolutions 41+:   the true steady state — extracts exactly the regenerated 5,000/turn
      #                      forever, closing=0, status STOCK_CONSTRAINED (never DEPLETED, since
      #                      available is never exactly zero while regeneration is active).
      # iron_ore (nonrenewable) declines by its full 20,000/resolution extracted amount forever,
      # with no regeneration to offset it — conservation holds exactly every resolution.
      resource_deposits:
        - category: timber
          remaining_stock: 200000
          extraction_capacity_per_turn: 10000
          output_per_worker: 25
          regeneration_per_turn: 5000
          stock_ceiling: 250000
        - category: iron_ore
          remaining_stock: 500000
          extraction_capacity_per_turn: 20000
          output_per_worker: 50
        - category: coal
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1
        - category: crude_oil
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1
        - category: natural_gas
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1
        - category: uranium
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1
        - category: copper
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1
        - category: critical_minerals
          remaining_stock: 0
          extraction_capacity_per_turn: 0
          output_per_worker: 1

      # Phase 2C2: physical-to-output bridge coefficients. REPLACES the extraction sector's old
      # capacity/productivity output formula (500,000,000, see the sector block above) with the sum
      # of each deposit's extracted quantity * its coefficient — chosen so turn 1's total is exactly
      # 500,000,000 (see docs/economy_methodology.md, "Calibration"), preserving every Phase
      # 2B/2C1 figure numerically at turn 1 only:
      #   timber:    10,000 x 10,000 =  100,000,000
      #   iron_ore:  20,000 x 20,000 =  400,000,000
      #   six others:      0 x (any) =            0  (positive coefficients required, D5, but
      #                                                always multiplied by zero here)
      #   total                     =  500,000,000  (matches the old formula exactly, turn 1 only)
      # From turn 26 (iron_ore depleted) the total drops to 100,000,000, and from turn 41 (timber's
      # renewable steady state) it drops again to 50,000,000 — an intentional divergence from the
      # pre-Phase-2C2 trajectory, not a calibration error; see the ADR/economy_methodology for the
      # exact hand-worked figures at every turn.
      resource_output_coefficients:
        - category: timber
          real_output_per_unit: 10000
        - category: iron_ore
          real_output_per_unit: 20000
        - category: coal
          real_output_per_unit: 1000
        - category: crude_oil
          real_output_per_unit: 1200
        - category: natural_gas
          real_output_per_unit: 1000
        - category: uranium
          real_output_per_unit: 100000
        - category: copper
          real_output_per_unit: 1000
        - category: critical_minerals
          real_output_per_unit: 5000

    # Phase 3A: a less-accepted presidential order under resource decline (see docs/adr/0009
    # and docs/economy_methodology.md, "Political calibration"). Two real, already-calibrated
    # production shocks (iron-ore depletion at turn 26, timber steady-state at turn 41 — see
    # ADR 0007/0008) cost this government legitimacy on top of drift: 6,000 -> ... -> 6,459
    # (turn 25) -> 6,213 (turn 26, -246) -> ... -> 6,431 (turn 40) -> 6,403 (turn 41, -28).
    politics:
      constitution:
        executive_system: presidential
        executive_selection: direct_election
        legislature: unicameral
        territorial_organization: unitary
        judicial_review: weak
        amendment_difficulty: simple_majority
        decree_authority: emergency_only
        national_election_interval_turns: 20
      constitutional_order_support_bps: 6500    # 65.00% authored acceptance of this order
      legitimacy_bps: 6000                      # 60.00% current legitimacy
      political_capital: 300
      political_capital_capacity: 800
      # Phase 3B1: a unicameral chamber in which the government is four seats short (see
      # docs/adr/0010 and docs/economy_methodology.md, "Legislative calibration"). This is the
      # scenario that makes the phase mean something: against the walkthrough proposal (+5 pp
      # personal income tax, spending unchanged) the government tallies 47/100 against a required
      # 51 and the budget FAILS unaided. It can be carried, but only by spending capital on blocs
      # that are not its own.
      #
      # `decree_authority: emergency_only` above means this government cannot decree either --
      # Phase 3B1 has no emergency system to read, so a bargain is its only route. Every figure
      # here is derived from this file by tests/test_scenario_legislature_calibration.py.
      legislature:
        chambers:
          - chamber: lower
            total_seats: 100
        parties:
          - id: citizens_bloc
            name: "Citizens' Bloc"
            government_role: opposition
            blocs:
              - id: hardliners
                name: "Citizens' Bloc Hardliners"
                seats:
                  - chamber: lower
                    seats: 30
                discipline_bps: 8000
                government_relationship_bps: -8000
                tax_preference_bps: -6000
                spending_preference_bps: -5000
              - id: moderates
                name: "Citizens' Bloc Moderates"
                seats:
                  - chamber: lower
                    seats: 20
                discipline_bps: 2000
                government_relationship_bps: -2000
                tax_preference_bps: -2000
                spending_preference_bps: 0
          - id: governing_party
            name: "Governing Party"
            government_role: coalition
            blocs:
              - id: core
                name: "Governing Party Core"
                seats:
                  - chamber: lower
                    seats: 34
                discipline_bps: 6000
                government_relationship_bps: 5000
                tax_preference_bps: 3000
                spending_preference_bps: 3000
              - id: left
                name: "Governing Party Left"
                seats:
                  - chamber: lower
                    seats: 6
                discipline_bps: 2000
                government_relationship_bps: 1000
                tax_preference_bps: 5000
                spending_preference_bps: 5000
          - id: independents
            name: "Independent Regionalists"
            government_role: confidence_and_supply
            blocs:
              - id: regional
                name: "Independent Regionalists"
                seats:
                  - chamber: lower
                    seats: 10
                discipline_bps: 1000
                government_relationship_bps: 1000
                tax_preference_bps: -2000
                spending_preference_bps: 2000
