# A minimal, valid MANDATE scenario fixture.
#
# This is NOT "The Arken Crisis" (product spec §36) — it is a deliberately
# tiny two-country world used to prove the simulation pipeline (scenario
# loading -> invariant validation -> turn resolution -> report generation)
# works end to end, now including Phase 2A government accounting. The
# authored initial scenario is Phase 8 work.
#
# arken's finance is a deliberately SUSTAINABLE budget: quarterly revenue
# comfortably exceeds spending + interest, so cash grows and debt never
# does. Used by the 100-turn soak test and general-purpose tests where a
# runaway deficit would be noise, not signal. For a scenario that
# deliberately runs a deficit and must borrow, see deficit_demo.yaml.
#
# Note: ruleset_version is NOT declared here — it comes from the engine's
# RULESET_VERSION constant (simulation.state), not from scenario content.

schema_version: 1
scenario_id: tiny_valid
name: "Tiny Valid Fixture"
content_version: "0.3.0"
seed: 42
player_country_id: arken

countries:
  - id: arken
    name: "Republic of Arken"
    population: 1000000
    treasury:
      cash_on_hand: 10000000000   # 100,000,000.00 denars, in minor units
      debt: 5000000000            #  50,000,000.00 denars
    population_groups:
      - id: urban_workers
        name: "Urban Workers"
        population_share: 0.40
        political_influence: 55
        approval: 52
        trust: 48
        organization: 35
        radicalization: 10
      - id: rural_farmers
        name: "Rural Farmers"
        population_share: 0.35
        political_influence: 45
        approval: 50
        trust: 50
        organization: 25
        radicalization: 5
      - id: business_owners
        name: "Business Owners"
        population_share: 0.25
        political_influence: 70
        approval: 60
        trust: 55
        organization: 40
        radicalization: 2
    institutions:
      - id: executive
        name: "Executive Government"
        loyalty: 80
        power: 70
        competence: 60
        corruption: 15
      - id: legislature
        name: "Legislature"
        loyalty: 60
        power: 55
        competence: 50
        corruption: 20
      - id: military
        name: "Military"
        loyalty: 75
        power: 65
        competence: 60
        corruption: 10
    finance:
      tax_bases:
        # Quarterly, in minor units (1/100 denar). Fixed for Phase 2A — a tax
        # rate change does not move these; see TaxBaseState's docstring.
        personal_income: 4000000000      #  40,000,000.00 denars
        corporate_profit: 2000000000     #  20,000,000.00 denars
        taxable_consumption: 3000000000  #  30,000,000.00 denars
      tax_policy:
        personal_income_rate_bps: 2000   # 20%
        corporate_rate_bps: 2500         # 25%
        consumption_rate_bps: 1000       # 10%
        compliance_rate_bps: 9000        # 90%
      spending_plan:
        health: 200000000            #   2,000,000.00 denars
        education: 150000000         #   1,500,000.00 denars
        welfare: 250000000           #   2,500,000.00 denars
        infrastructure: 120000000    #   1,200,000.00 denars
        defense: 180000000           #   1,800,000.00 denars
        security: 90000000           #     900,000.00 denars
        administration: 60000000     #     600,000.00 denars
      annual_debt_interest_rate_bps: 600   # 6% annual
    economy:
      # Phase 2B1 sector production, fixed base-year prices, all 11 categories.
      # Deliberately covers all four constraint classifications so the
      # 100-turn soak (and any other test walking this scenario) exercises
      # every code path in production_accounting.compute_sector_output.
      # Hand-checked per sector (labor_limited_output = employed_workers *
      # output_per_worker; actual_output = min(capacity, labor_limited)):
      #   agriculture:      6,000 * 100   =   600,000 > capacity 500,000  -> capacity_constrained, actual=500,000
      #   extraction:       4,000 * 50    =   200,000 < capacity 300,000 -> labor_constrained,    actual=200,000
      #   manufacturing:    2,000 * 200   =   400,000 = capacity 400,000 -> exactly_balanced,     actual=400,000
      #   construction:     capacity 0                                  -> inactive,              actual=0
      #   energy:           1,000 * 125   =   125,000 < capacity 250,000 -> labor_constrained,    actual=125,000
      #   transportation:   3,000 * 75    =   225,000 > capacity 150,000 -> capacity_constrained, actual=150,000
      #   consumer_services:5,000 * 40    =   200,000 = capacity 200,000 -> exactly_balanced,     actual=200,000
      #   finance_and_professional_services: 50 * 1,000 = 50,000 < capacity 100,000 -> labor_constrained, actual=50,000
      #   technology:         300 * 400   =   120,000 > capacity 80,000  -> capacity_constrained, actual=80,000
      #   defense_industry:   200 * 300   =    60,000 = capacity 60,000  -> exactly_balanced,     actual=60,000
      #   public_services:  capacity 0                                  -> inactive,              actual=0
      # total_employment = 21,550 (<< population 1,000,000)
      # total_gross_output = 1,765,000 (fixed base-year output minor units — NOT GDP, NOT money)
      sectors:
        - category: agriculture
          quarterly_capacity_output: 500000
          output_per_worker: 100
          employed_workers: 6000
        - category: extraction
          quarterly_capacity_output: 300000
          output_per_worker: 50
          employed_workers: 4000
        - category: manufacturing
          quarterly_capacity_output: 400000
          output_per_worker: 200
          employed_workers: 2000
        - category: construction
          quarterly_capacity_output: 0
          output_per_worker: 1
          employed_workers: 0
        - category: energy
          quarterly_capacity_output: 250000
          output_per_worker: 125
          employed_workers: 1000
        - category: transportation
          quarterly_capacity_output: 150000
          output_per_worker: 75
          employed_workers: 3000
        - category: consumer_services
          quarterly_capacity_output: 200000
          output_per_worker: 40
          employed_workers: 5000
        - category: finance_and_professional_services
          quarterly_capacity_output: 100000
          output_per_worker: 1000
          employed_workers: 50
        - category: technology
          quarterly_capacity_output: 80000
          output_per_worker: 400
          employed_workers: 300
        - category: defense_industry
          quarterly_capacity_output: 60000
          output_per_worker: 300
          employed_workers: 200
        - category: public_services
          quarterly_capacity_output: 0
          output_per_worker: 1
          employed_workers: 0

  - id: neighbor
    name: "Neighboring State"
    population: 500000
    treasury:
      cash_on_hand: 3000000000    #  30,000,000.00 denars
      debt: 1000000000            #  10,000,000.00 denars
    population_groups:
      - id: citizens
        name: "Citizens"
        population_share: 1.0
        political_influence: 50
        approval: 55
        trust: 50
        organization: 20
        radicalization: 3
    institutions:
      - id: executive
        name: "Executive Government"
        loyalty: 70
        power: 60
        competence: 55
        corruption: 20
