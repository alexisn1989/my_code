# A minimal, valid MANDATE scenario fixture.
#
# This is NOT "The Arken Crisis" (product spec §36) — it is a deliberately
# tiny two-country world used to prove the simulation pipeline (scenario
# loading -> invariant validation -> turn resolution -> report generation)
# works end to end, now including Phase 2A government accounting. The
# authored initial scenario is Phase 8 work.
#
# arken's finance is a deliberately SUSTAINABLE budget: quarterly revenue
# comfortably exceeds spending + interest, so cash grows and debt never
# does. Used by the 100-turn soak test and general-purpose tests where a
# runaway deficit would be noise, not signal. For a scenario that
# deliberately runs a deficit and must borrow, see deficit_demo.yaml.
#
# Note: ruleset_version is NOT declared here — it comes from the engine's
# RULESET_VERSION constant (simulation.state), not from scenario content.

schema_version: 1
scenario_id: tiny_valid
name: "Tiny Valid Fixture"
content_version: "0.4.0"
seed: 42
player_country_id: arken

countries:
  - id: arken
    name: "Republic of Arken"
    population: 1000000
    treasury:
      cash_on_hand: 10000000000   # 100,000,000.00 denars, in minor units
      debt: 5000000000            #  50,000,000.00 denars
    population_groups:
      - id: urban_workers
        name: "Urban Workers"
        population_share: 0.40
        political_influence: 55
        approval: 52
        trust: 48
        organization: 35
        radicalization: 10
      - id: rural_farmers
        name: "Rural Farmers"
        population_share: 0.35
        political_influence: 45
        approval: 50
        trust: 50
        organization: 25
        radicalization: 5
      - id: business_owners
        name: "Business Owners"
        population_share: 0.25
        political_influence: 70
        approval: 60
        trust: 55
        organization: 40
        radicalization: 2
    institutions:
      - id: executive
        name: "Executive Government"
        loyalty: 80
        power: 70
        competence: 60
        corruption: 15
      - id: legislature
        name: "Legislature"
        loyalty: 60
        power: 55
        competence: 50
        corruption: 20
      - id: military
        name: "Military"
        loyalty: 75
        power: 65
        competence: 60
        corruption: 10
    finance:
      # As of Phase 2B2, tax bases are NOT authored here — they are derived every turn from
      # this country's economy (below) via simulation.tax_base_derivation. What IS authored
      # is the country's fiscal reach: tax_base_coefficients.
      tax_base_coefficients:
        personal_taxable_share_bps: 8000              # 80% of sector labor income is personal tax base
        corporate_taxable_share_bps: 4000              # 40% of sector operating surplus is corporate tax base
        effective_consumption_base_share_bps: 3000      # 30% of sector modeled value added is consumption tax base
        # (effective_consumption_base_share_bps is a deliberately reduced-form placeholder —
        # see docs/economy_methodology.md and ADR 0005 for what it currently conflates.)
      tax_policy:
        personal_income_rate_bps: 2000   # 20%
        corporate_rate_bps: 2500         # 25%
        consumption_rate_bps: 1000       # 10%
        compliance_rate_bps: 9000        # 90%
      spending_plan:
        health: 200000000            #   2,000,000.00 denars
        education: 150000000         #   1,500,000.00 denars
        welfare: 250000000           #   2,500,000.00 denars
        infrastructure: 120000000    #   1,200,000.00 denars
        defense: 180000000           #   1,800,000.00 denars
        security: 90000000           #     900,000.00 denars
        administration: 60000000     #     600,000.00 denars
      annual_debt_interest_rate_bps: 600   # 6% annual
    economy:
      # Phase 2B2 calibration note: sector outputs below are scaled (relative to the original
      # Phase 2B1 fixture) via quarterly_capacity_output/output_per_worker ONLY — never
      # employed_workers — specifically so that production-derived tax bases reproduce this
      # scenario's original Phase 2A hand-checked bases EXACTLY, at a base-year price index of
      # 1.0 (see app.core.quantity.base_year_real_output_to_money). Every sector uses uniform
      # value_added_share_bps=5000 (50%) / labor_income_share_bps=5000 (50%); country-level
      # tax_base_coefficients are declared above.
      #
      # Still deliberately covers all four constraint classifications so the 100-turn soak
      # exercises every code path in production_accounting.compute_sector_output. Hand-checked
      # per sector (labor_limited_output = employed_workers * output_per_worker; actual_output
      # = min(capacity, labor_limited)):
      #   agriculture:       12,000 *   200,000 = 2,400,000,000 > capacity 2,000,000,000 -> capacity_constrained, actual=2,000,000,000
      #   extraction:        20,000 *   100,000 = 2,000,000,000 < capacity 3,000,000,000 -> labor_constrained,    actual=2,000,000,000
      #   manufacturing:      2,000 * 1,000,000 = 2,000,000,000 = capacity 2,000,000,000 -> exactly_balanced,     actual=2,000,000,000
      #   construction:      capacity 0                                                  -> inactive,            actual=0
      #   energy:             8,000 *   250,000 = 2,000,000,000 < capacity 2,500,000,000 -> labor_constrained,    actual=2,000,000,000
      #   transportation:     3,000 *   750,000 = 2,250,000,000 > capacity 2,000,000,000 -> capacity_constrained, actual=2,000,000,000
      #   consumer_services:  5,000 *   400,000 = 2,000,000,000 = capacity 2,000,000,000 -> exactly_balanced,     actual=2,000,000,000
      #   finance_and_professional_services: 200 * 10,000,000 = 2,000,000,000 = capacity 2,000,000,000 -> exactly_balanced, actual=2,000,000,000
      #   technology:         2,000 * 2,000,000 = 4,000,000,000 = capacity 4,000,000,000 -> exactly_balanced,     actual=4,000,000,000
      #   defense_industry:   5,000 *   500,000 = 2,500,000,000 > capacity 2,000,000,000 -> capacity_constrained, actual=2,000,000,000
      #   public_services:   capacity 0                                                  -> inactive,            actual=0
      # total_employment = 57,200 (<< population 1,000,000)
      # total_gross_output = 20,000,000,000 (fixed base-year output minor units — NOT GDP, NOT money)
      #
      # Tax-base derivation check (uniform va_share=5000, labor_share=5000 across all sectors;
      # coefficients personal=8000, corporate=4000, effective_consumption=3000):
      #   modeled_value_added(total) = 20,000,000,000 * 0.5 = 10,000,000,000
      #   labor_income(total)        = 10,000,000,000 * 0.5 =  5,000,000,000
      #   operating_surplus(total)   = 10,000,000,000 -  5,000,000,000 =  5,000,000,000
      #   personal_income base       =  5,000,000,000 * 0.8 =  4,000,000,000  (matches Phase 2A original exactly)
      #   corporate_profit base      =  5,000,000,000 * 0.4 =  2,000,000,000  (matches Phase 2A original exactly)
      #   taxable_consumption base   = 10,000,000,000 * 0.3 =  3,000,000,000  (matches Phase 2A original exactly)
      sectors:
        - category: agriculture
          quarterly_capacity_output: 2000000000
          output_per_worker: 200000
          employed_workers: 12000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: extraction
          quarterly_capacity_output: 3000000000
          output_per_worker: 100000
          employed_workers: 20000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: manufacturing
          quarterly_capacity_output: 2000000000
          output_per_worker: 1000000
          employed_workers: 2000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: construction
          quarterly_capacity_output: 0
          output_per_worker: 1
          employed_workers: 0
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: energy
          quarterly_capacity_output: 2500000000
          output_per_worker: 250000
          employed_workers: 8000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: transportation
          quarterly_capacity_output: 2000000000
          output_per_worker: 750000
          employed_workers: 3000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: consumer_services
          quarterly_capacity_output: 2000000000
          output_per_worker: 400000
          employed_workers: 5000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: finance_and_professional_services
          quarterly_capacity_output: 2000000000
          output_per_worker: 10000000
          employed_workers: 200
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: technology
          quarterly_capacity_output: 4000000000
          output_per_worker: 2000000
          employed_workers: 2000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: defense_industry
          quarterly_capacity_output: 2000000000
          output_per_worker: 500000
          employed_workers: 5000
          value_added_share_bps: 5000
          labor_income_share_bps: 5000
        - category: public_services
          quarterly_capacity_output: 0
          output_per_worker: 1
          employed_workers: 0
          value_added_share_bps: 5000
          labor_income_share_bps: 5000

  - id: neighbor
    name: "Neighboring State"
    population: 500000
    treasury:
      cash_on_hand: 3000000000    #  30,000,000.00 denars
      debt: 1000000000            #  10,000,000.00 denars
    population_groups:
      - id: citizens
        name: "Citizens"
        population_share: 1.0
        political_influence: 50
        approval: 55
        trust: 50
        organization: 20
        radicalization: 3
    institutions:
      - id: executive
        name: "Executive Government"
        loyalty: 70
        power: 60
        competence: 55
        corruption: 20
