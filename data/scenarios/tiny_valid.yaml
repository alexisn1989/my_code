# This is NOT "The Arken Crisis" (product spec §36) — it is a deliberately
# tiny two-country world used only to prove the Phase 1 pipeline (scenario
# loading -> invariant validation -> turn resolution -> report generation)
# works end to end. The authored initial scenario is Phase 8 work.

