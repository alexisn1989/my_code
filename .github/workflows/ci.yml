name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      # --locked fails the build if uv.lock is out of date relative to
      # pyproject.toml, rather than silently re-resolving (product spec §5.5,
      # keep committed dependency resolution reproducible).
      - name: Install dependencies (locked)
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check (simulation engine + core)
        run: uv run mypy app/core app/simulation

      - name: Test
        run: uv run pytest -v

  # Frontend is a config-only scaffold as of Phase 0/1 (see docs/roadmap.md) —
  # no `npm install` has been run or verified yet in this repository. A
  # frontend CI job is added once the toolchain is installed and exercised,
  # starting Phase 5.
